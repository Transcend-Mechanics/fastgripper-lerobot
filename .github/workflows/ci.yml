name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catch upstream lerobot breakage early

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    continue-on-error: ${{ matrix.python == '3.13' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv venv --python ${{ matrix.python }} .venv
      - run: uv pip install -p .venv/bin/python -e ".[dev]"
      - run: .venv/bin/pytest tests -q

  test-lerobot-main:
    # tripwire: we subclass non-guaranteed lerobot internals
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv venv --python 3.12 .venv
      - run: uv pip install -p .venv/bin/python -e ".[dev]" "lerobot[feetech] @ git+https://github.com/huggingface/lerobot.git"
      - run: .venv/bin/pytest tests -q
